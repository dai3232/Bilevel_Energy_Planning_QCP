stage_id: "stage_B"
milestone_id: "B-2C"

# continuous 使用下面的连续首尾日；screened_307 固定覆盖全年并剔除
# 已确认的41个物理不可行日和17个数值病态日。
day_scope: "continuous"
day_start: 1
day_end: 365

# 本次运行允许的最多接受迭代次数。
max_iterations: 100
require_convergence: true

# full_kkt 仅允许 continuous 的恰好7日且必须关闭并行；screened_307
# 必须使用 recursive_only。
audit_mode: "recursive_only"

# lightweight：只保留最终容量/出力、最终状态MAT、逐轮收敛与计时历史、
# 最终收敛指标和必要物理审计；不写逐轮检查点、矩阵工件和Word报告。
# full_evidence：保留完整证据链和断点续算能力。
run_output_mode: "lightweight"

# 日块LDL回代精化仍由阶段配置控制（递推模式为3次）。下面两项只控制
# 16维核心与直接日回代之间的一致性校正；核心残差达到1e-10且重构
# KKT残差达到1e-8时提前停止。
core_consistency_max_passes: 10
compensated_core_accumulation: true

# 日块执行方式。false 表示串行；改回 true 时使用独立 MATLAB 进程，
# 不改变16维核心、状态更新、检查点、审计和报告的串行顺序。
parallel_enabled: false
parallel_worker_count: 4
parallel_pool_auto_resize: true
parallel_pool_keep_alive: true

# 缓存总开关：年度数据、full_kkt 审计索引、递推结构缓存。
# recursive_only 无论结构缓存 HIT/MISS 都不会读取 canonical index。
cache_enabled: true
force_rebuild_data_cache: false
force_rebuild_index_cache: false
# 结构缓存只保存拓扑、位置、排列和恢复映射；负荷、风光系数、水量边界
# 等数值由每次运行的 numerical payload 直接刷新。
force_rebuild_recursive_structure_cache: false

# 经过人工确认的负荷修正覆盖层。false 时完全使用原始 Excel；true 时
# 仅用下表覆盖指定日/小时，并把修正表 SHA256 纳入数据与递推缓存身份。
load_correction_enabled: true
load_correction_file: "config/stage_B_2C_365day_manual_load_corrections.csv"

# 留空表示创建新运行；仅 full_evidence 可填写 RUNNING 目录断点续算。
# lightweight 不生成逐轮检查点，不能断点续算。
run_id: ""
resume_run_directory: ""
